<!DOCTYPE html>
<html>
<head>
    <title>FPL Squad Validator</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            padding: 20px; 
            background: #0f1419; 
            color: #e1e8ed; 
            max-width: 1400px;
            margin: 0 auto;
        }
        h1 { color: #00ff88; border-bottom: 2px solid #00ff88; padding-bottom: 10px; }
        h2 { color: #4a9eff; margin-top: 30px; }
        button { 
            padding: 12px 24px; 
            font-size: 16px; 
            cursor: pointer; 
            margin: 10px 5px; 
            background: #00ff88;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            color: #0f1419;
        }
        button:hover { background: #00dd70; }
        input { 
            padding: 8px; 
            font-size: 16px; 
            border: 2px solid #2a3441;
            background: #1a2332;
            color: #e1e8ed;
            border-radius: 3px;
        }
        .team-comparison {
            background: #1a2332;
            margin: 15px 0;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #4a9eff;
        }
        .team-comparison.match {
            border-left-color: #00ff88;
        }
        .team-comparison.mismatch {
            border-left-color: #ff4757;
        }
        .player-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 10px;
            margin: 10px 0;
        }
        .player {
            background: #253241;
            padding: 8px;
            border-radius: 4px;
            font-size: 14px;
        }
        .player.in-db { border-left: 3px solid #00ff88; }
        .player.missing { border-left: 3px solid #ff4757; color: #ff4757; }
        .player.extra { border-left: 3px solid #ffa502; color: #ffa502; }
        .summary {
            background: #2a3441;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
        }
        .summary-stat {
            display: inline-block;
            margin: 10px 20px;
            font-size: 18px;
        }
        .summary-stat strong { color: #00ff88; font-size: 24px; }
        .loading { color: #4a9eff; font-style: italic; }
        .error { color: #ff4757; background: #2a1a1a; padding: 15px; border-radius: 5px; margin: 10px 0; }
        .success { color: #00ff88; background: #1a2a1a; padding: 15px; border-radius: 5px; margin: 10px 0; }
        pre { 
            background: #0a0e13; 
            padding: 15px; 
            border-radius: 5px; 
            overflow-x: auto;
            font-size: 12px;
        }
        details { margin: 15px 0; }
        summary { 
            cursor: pointer; 
            padding: 10px;
            background: #253241;
            border-radius: 5px;
            margin: 5px 0;
        }
        summary:hover { background: #2a3a4a; }
    </style>
</head>
<body>
    <h1>🔍 FPL Squad Validator</h1>
    <p>Compare your database squads with live FPL data to detect missing trades or sync issues.</p>
    
    <div style="background: #1a2332; padding: 20px; border-radius: 8px; margin: 20px 0;">
        <label><strong>League ID:</strong> <input type="number" id="leagueId" value="201560" style="width: 150px;"></label>
        <label style="margin-left: 20px;"><strong>Gameweek:</strong> <input type="number" id="gameweek" value="21" style="width: 80px;"></label>
        <br><br>
        <button onclick="validateSquads()">🔎 Validate Squads</button>
        <button onclick="fetchAndShowLiveSquads()" style="background: #4a9eff;">📡 Show Live FPL Squads Only</button>
    </div>
    
    <div id="results"></div>
    
    <script>
        let dbSquads = null;
        let liveSquads = null;
        let playerMap = null;
        
        async function fetchLiveSquads() {
            const leagueId = document.getElementById('leagueId').value;
            const gameweek = document.getElementById('gameweek').value;
            
            // Fetch league details to get entries
            const leagueRes = await fetch(`https://draft.premierleague.com/api/league/${leagueId}/details`);
            if (!leagueRes.ok) throw new Error('Failed to fetch league. Are you logged in?');
            const league = await leagueRes.json();
            
            // Fetch bootstrap for player names
            const bootRes = await fetch('https://draft.premierleague.com/api/bootstrap-static');
            const bootstrap = await bootRes.json();
            playerMap = {};
            bootstrap.elements.forEach(p => {
                playerMap[p.id] = {
                    name: p.web_name,
                    fullName: `${p.first_name} ${p.second_name}`,
                    team: bootstrap.teams.find(t => t.id === p.team)?.short_name || '?'
                };
            });
            
            // Fetch each squad
            const squads = {};
            const entries = league.league_entries || [];
            
            for (const entry of entries) {
                const squadRes = await fetch(`https://draft.premierleague.com/api/entry/${entry.entry_id}/event/${gameweek}`);
                const squadData = await squadRes.json();
                
                squads[entry.entry_id] = {
                    name: entry.entry_name,
                    short_name: entry.short_name || entry.entry_name.substring(0, 10),
                    players: squadData.picks.map(p => p.element)
                };
            }
            
            return squads;
        }
        
        async function fetchDbSquads() {
            const gameweek = document.getElementById('gameweek').value;
            const response = await fetch(`http://localhost:5001/api/db/squads?gameweek=${gameweek}`);
            if (!response.ok) throw new Error('Failed to fetch DB squads. Is server running?');
            
            const data = await response.json();
            const squads = {};
            
            // Group by entry_id
            data.forEach(row => {
                if (!squads[row.entry_id]) {
                    squads[row.entry_id] = {
                        name: row.entry_name || `Entry ${row.entry_id}`,
                        short_name: row.short_name || `E${row.entry_id}`,
                        players: []
                    };
                }
                squads[row.entry_id].players.push(row.player_id);
            });
            
            return squads;
        }
        
        async function fetchAndShowLiveSquads() {
            const results = document.getElementById('results');
            results.innerHTML = '<div class="loading">📡 Fetching live FPL squads...</div>';
            
            try {
                liveSquads = await fetchLiveSquads();
                
                let html = '<h2>📡 Live FPL Squads</h2>';
                
                for (const [entryId, squad] of Object.entries(liveSquads)) {
                    html += `<div class="team-comparison">`;
                    html += `<h3>${squad.name} (${squad.short_name}) - Entry ${entryId}</h3>`;
                    html += `<p><strong>Total Players:</strong> ${squad.players.length}</p>`;
                    html += `<div class="player-list">`;
                    
                    squad.players.sort((a, b) => a - b).forEach(playerId => {
                        const player = playerMap[playerId];
                        html += `<div class="player in-db">
                            ${player ? player.name : `ID ${playerId}`}
                            ${player ? `<br><small>${player.team}</small>` : ''}
                        </div>`;
                    });
                    
                    html += `</div></div>`;
                }
                
                results.innerHTML = html;
                
            } catch (error) {
                results.innerHTML = `<div class="error">❌ Error: ${error.message}</div>`;
            }
        }
        
        async function validateSquads() {
            const results = document.getElementById('results');
            results.innerHTML = '<div class="loading">🔄 Fetching data...</div>';
            
            try {
                // Fetch both
                results.innerHTML = '<div class="loading">📡 Fetching live FPL squads...</div>';
                liveSquads = await fetchLiveSquads();
                
                results.innerHTML = '<div class="loading">💾 Fetching database squads...</div>';
                dbSquads = await fetchDbSquads();
                
                // Compare
                let html = '<div class="summary">';
                html += '<h2>📊 Validation Summary</h2>';
                
                let totalMatches = 0;
                let totalMismatches = 0;
                let totalMissingPlayers = 0;
                let totalExtraPlayers = 0;
                
                for (const entryId in liveSquads) {
                    const live = liveSquads[entryId];
                    const db = dbSquads[entryId];
                    
                    if (!db) {
                        totalMismatches++;
                        continue;
                    }
                    
                    const liveSet = new Set(live.players);
                    const dbSet = new Set(db.players);
                    
                    const missing = [...liveSet].filter(p => !dbSet.has(p));
                    const extra = [...dbSet].filter(p => !liveSet.has(p));
                    
                    if (missing.length === 0 && extra.length === 0) {
                        totalMatches++;
                    } else {
                        totalMismatches++;
                        totalMissingPlayers += missing.length;
                        totalExtraPlayers += extra.length;
                    }
                }
                
                html += `<div class="summary-stat">
                    <div>✅ Perfect Matches</div>
                    <strong>${totalMatches}</strong>
                </div>`;
                html += `<div class="summary-stat">
                    <div>⚠️ Mismatches</div>
                    <strong style="color: ${totalMismatches > 0 ? '#ff4757' : '#00ff88'}">${totalMismatches}</strong>
                </div>`;
                html += `<div class="summary-stat">
                    <div>❌ Missing in DB</div>
                    <strong style="color: #ff4757">${totalMissingPlayers}</strong>
                </div>`;
                html += `<div class="summary-stat">
                    <div>➕ Extra in DB</div>
                    <strong style="color: #ffa502">${totalExtraPlayers}</strong>
                </div>`;
                html += '</div>';
                
                if (totalMismatches === 0) {
                    html += '<div class="success">🎉 Perfect! All squads match exactly!</div>';
                } else {
                    html += '<div class="error">⚠️ Mismatches detected! Your DB is out of sync with FPL.</div>';
                }
                
                // Detailed comparison
                html += '<h2>🔍 Detailed Comparison</h2>';
                
                for (const entryId in liveSquads) {
                    const live = liveSquads[entryId];
                    const db = dbSquads[entryId];
                    
                    const liveSet = new Set(live.players);
                    const dbSet = new Set(db ? db.players : []);
                    
                    const missing = [...liveSet].filter(p => !dbSet.has(p));
                    const extra = db ? [...dbSet].filter(p => !liveSet.has(p)) : [];
                    const match = missing.length === 0 && extra.length === 0;
                    
                    html += `<div class="team-comparison ${match ? 'match' : 'mismatch'}">`;
                    html += `<h3>${match ? '✅' : '⚠️'} ${live.name} (${live.short_name})</h3>`;
                    html += `<p>
                        <strong>Live FPL:</strong> ${live.players.length} players &nbsp;|&nbsp;
                        <strong>Database:</strong> ${db ? db.players.length : 0} players
                    </p>`;
                    
                    if (!match) {
                        if (missing.length > 0) {
                            html += `<h4 style="color: #ff4757;">❌ Missing in DB (${missing.length}):</h4>`;
                            html += `<div class="player-list">`;
                            missing.forEach(playerId => {
                                const player = playerMap[playerId];
                                html += `<div class="player missing">
                                    ${player ? player.name : `ID ${playerId}`}
                                    ${player ? `<br><small>${player.fullName} (${player.team})</small>` : ''}
                                </div>`;
                            });
                            html += `</div>`;
                        }
                        
                        if (extra.length > 0) {
                            html += `<h4 style="color: #ffa502;">➕ Extra in DB (${extra.length}):</h4>`;
                            html += `<div class="player-list">`;
                            extra.forEach(playerId => {
                                const player = playerMap[playerId];
                                html += `<div class="player extra">
                                    ${player ? player.name : `ID ${playerId}`}
                                    ${player ? `<br><small>${player.fullName} (${player.team})</small>` : ''}
                                </div>`;
                            });
                            html += `</div>`;
                        }
                    }
                    
                    html += `<details>
                        <summary>Show all ${live.players.length} players</summary>
                        <div class="player-list">`;
                    
                    live.players.sort((a, b) => a - b).forEach(playerId => {
                        const player = playerMap[playerId];
                        const inDb = dbSet.has(playerId);
                        html += `<div class="player ${inDb ? 'in-db' : 'missing'}">
                            ${inDb ? '✓' : '❌'} ${player ? player.name : `ID ${playerId}`}
                            ${player ? `<br><small>${player.team}</small>` : ''}
                        </div>`;
                    });
                    
                    html += `</div></details>`;
                    html += `</div>`;
                }
                
                results.innerHTML = html;
                
            } catch (error) {
                results.innerHTML = `<div class="error">
                    ❌ Error: ${error.message}
                    <br><br>
                    <strong>Troubleshooting:</strong>
                    <ul>
                        <li>Make sure you're logged into draft.premierleague.com</li>
                        <li>Check that the Flask server is running on port 5001</li>
                        <li>Verify the League ID is correct</li>
                    </ul>
                </div>`;
            }
        }
    </script>
</body>
</html>
